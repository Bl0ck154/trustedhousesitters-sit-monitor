name = "ths-sit-monitor"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Do not add cron triggers to staging. Production schedules are activated ONLY at cutover.
[vars]
LIVE_MODE = "false"
SCAN_ENABLED = "false"
WEBHOOK_ENABLED = "false"
SCAN_PROFILE = "quick"
THS_EARLIEST_START = "2026-11-14"
[[d1_databases]]
binding = "DB"
database_name = "ths-sit-monitor-live"
database_id = "005aaac8-f1db-48c3-8ef1-110a173ab967"

[env.staging]
name = "ths-sit-monitor-staging"
workers_dev = true
[env.staging.vars]
LIVE_MODE = "false"
SCAN_ENABLED = "false"
WEBHOOK_ENABLED = "false"
SCAN_PROFILE = "quick"
THS_EARLIEST_START = "2026-11-14"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "ths-sit-monitor-staging"
database_id = "290b9f61-cc5e-4d77-a6d6-5f89aeec7a7c"
